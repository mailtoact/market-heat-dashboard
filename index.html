<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0e11">
<title>Market Heat</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Market Heat">
<style>
  :root{
    --bg: #0b0e11;
    --panel: #12161b;
    --panel-2: #171c22;
    --line: #232a32;
    --ink: #e7ecef;
    --ink-dim: #8a97a3;
    --ink-faint: #55626e;
    --amber: #e0a83e;
    --cool: #4f9dd4;
    --warm: #d9762f;
    --hot: #c94f4f;
    --good: #4f9d6e;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{padding-bottom:calc(28px + env(safe-area-inset-bottom));}
  a{color:inherit;}

  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  header.top{
    padding:calc(18px + env(safe-area-inset-top)) 16px 10px;
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{font-family:var(--mono);letter-spacing:.08em;font-size:12px;color:var(--ink-faint);text-transform:uppercase;}
  header.top .clock{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}

  .hero{padding:22px 0 8px;}
  .hero-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
  .regime{
    font-size:38px;font-weight:700;letter-spacing:-0.01em;margin:4px 0 2px;
    display:flex;align-items:center;gap:10px;
  }
  .regime .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 14px 2px currentColor;}
  .narrative{color:var(--ink-dim);font-size:14.5px;line-height:1.5;margin:6px 0 18px;max-width:56ch;}

  .gauge-wrap{margin:10px 0 6px;}
  .gauge{
    position:relative;height:14px;border-radius:8px;overflow:visible;
    background:linear-gradient(90deg, #2d6fa3 0%, #4f9dd4 22%, #e0a83e 48%, #d9762f 70%, #c94f4f 100%);
  }
  .gauge .tick{position:absolute;top:-5px;bottom:-5px;width:1px;background:rgba(0,0,0,.35);}
  .gauge .marker{
    position:absolute;top:-7px;width:3px;height:28px;background:#fff;border-radius:2px;
    box-shadow:0 0 0 3px rgba(11,14,17,.9), 0 0 10px rgba(255,255,255,.5);
    transition:left .6s cubic-bezier(.2,.8,.2,1);
  }
  .gauge-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:8px;}
  .gauge-score{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .gauge-score b{color:var(--ink);font-size:15px;}

  .health{
    margin:18px 0 4px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
    display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;background:var(--panel);
  }
  .health .hstat{width:8px;height:8px;border-radius:50%;flex:none;}
  .health .hstat.full{background:var(--good);}
  .health .hstat.partial{background:var(--amber);}
  .health .hstat.bad{background:var(--hot);}
  .health .htxt{color:var(--ink-dim);flex:1;}

  .section-label{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);margin:26px 0 10px;
  }

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card{
    border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 13px;
    position:relative; overflow:hidden;
  }
  .card.unavailable{opacity:.45;}
  .card .clabel{font-size:11.5px;color:var(--ink-dim);margin-bottom:6px;line-height:1.3;}
  .card .cvalue{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:5px;}
  .card .cunit{font-size:12px;color:var(--ink-faint);font-weight:400;}
  .card .ctrend{font-family:var(--mono);font-size:11px;margin-top:5px;display:flex;align-items:center;gap:4px;}
  .card .ctrend.rising{color:var(--good);}
  .card .ctrend.falling{color:var(--warm);}
  .card .ctrend.flat{color:var(--ink-faint);}
  .card .cmeta{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:8px;
    border-top:1px solid var(--line);padding-top:6px;}
  .card .cmeta .err{color:var(--hot);}

  .guide{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:4px 0;overflow:hidden;}
  .grow{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:13.5px;}
  .grow + .grow{border-top:1px solid var(--line);}
  .grow .glabel{color:var(--ink-dim);}
  .grow .gval{color:var(--ink);font-weight:500;text-align:right;max-width:60%;}
  .stance-banner{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 14px;color:var(--ink);background:var(--panel-2);border-bottom:1px solid var(--line);
  }

  footer{margin:30px 0 10px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);}
  .skeleton{color:var(--ink-faint);text-align:center;padding:60px 20px;font-family:var(--mono);font-size:13px;}

  @media (max-width:380px){
    .regime{font-size:31px;}
    .grid{grid-template-columns:1fr 1fr;gap:8px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Market Heat</div>
    <div class="clock" id="clock">—</div>
  </header>

  <div id="app">
    <div class="skeleton">Loading market metrics…</div>
  </div>

  <footer>
    Data: FRED API &amp; Yahoo Finance · Pipeline V5<br>
    Decision-support only — not investment advice.
  </footer>
</div>

<script>
const REGIME_COLOR = {
  "Low Heat": "var(--good)",
  "Elevated": "var(--amber)",
  "High Heat": "var(--warm)",
  "Stress": "var(--hot)",
  "Unknown": "var(--ink-faint)",
};

const GUIDE_LABELS = [
  ["equities","Equities"], ["gold","Gold"], ["btc","BTC"],
  ["bonds","Bonds"], ["tips","TIPS"], ["cash","Cash"],
];

function fmtAgo(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const mins = Math.round((Date.now()-d.getTime())/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + "m ago";
  const hrs = Math.round(mins/60);
  if(hrs < 48) return hrs + "h ago";
  return Math.round(hrs/24) + "d ago";
}

function trendArrow(t){
  if(t === "rising") return "▲";
  if(t === "falling") return "▼";
  return "·";
}

function renderHealth(h){
  const ratio = h.total_count ? h.live_count / h.total_count : 0;
  const cls = ratio === 1 ? "full" : (ratio >= 0.6 ? "partial" : "bad");
  return `<div class="health">
    <div class="hstat ${cls}"></div>
    <div class="htxt">Data Health — ${h.status}</div>
  </div>`;
}

function renderGauge(score, regime){
  const pct = score === null || score === undefined ? 0 : Math.max(0, Math.min(100, score));
  return `
    <div class="gauge-wrap">
      <div class="gauge">
        <div class="tick" style="left:25%"></div>
        <div class="tick" style="left:50%"></div>
        <div class="tick" style="left:75%"></div>
        <div class="marker" style="left:calc(${pct}% - 1.5px)"></div>
      </div>
      <div class="gauge-scale"><span>0 Low</span><span>25</span><span>50</span><span>75</span><span>100 Stress</span></div>
      <div class="gauge-score">Heat Score <b>${score === null || score === undefined ? "—" : score}</b> / 100</div>
    </div>`;
}

function renderCard(res){
  if(!res || res.status !== "live"){
    const label = res ? (res.label || "Indicator") : "—";
    const err = res && res.error ? res.error : "No data";
    return `<div class="card unavailable">
      <div class="clabel">${label}</div>
      <div class="cvalue">—</div>
      <div class="cmeta err">${err}</div>
    </div>`;
  }
  const arrow = trendArrow(res.trend);
  const trendCls = res.trend || "flat";
  let chg = "";
  if(res.change_display === "pp" && res.change_abs !== null && res.change_abs !== undefined){
    chg = `${res.change_abs > 0 ? "+" : ""}${res.change_abs}pp`;
  } else if(res.change_pct !== null && res.change_pct !== undefined){
    chg = `${res.change_pct > 0 ? "+" : ""}${res.change_pct}%`;
  }
  return `<div class="card">
    <div class="clabel">${res.label}</div>
    <div class="cvalue">${res.value}<span class="cunit">${res.unit || ""}</span></div>
    <div class="ctrend ${trendCls}">${arrow} ${res.trend || "flat"} ${chg}</div>
    <div class="cmeta">${res.date || ""} · ${res.source || ""}</div>
  </div>`;
}

function render(data){
  const hs = data.heat_score || {};
  const regime = hs.regime || "Unknown";
  const color = REGIME_COLOR[regime] || "var(--ink-faint)";
  const narrative = (data.interpretation && data.interpretation.narrative) || "";
  const guidance = (data.interpretation && data.interpretation.portfolio_guidance) || {};

  const order = [
    "vix", "ad_ratio", 
    "breadth_50sma", "breadth_200sma", 
    "wti", "dxy", 
    "y2", "y10", 
    "spread_10y2y", "hy_spread", 
    "unemployment", "sahm_rule"
  ];

  const cards = order.map(k => {
    let indicatorData = data.indicators ? data.indicators[k] : null;
    if (!indicatorData && data.indicators) {
      const foundKey = Object.keys(data.indicators).find(key => key.toLowerCase().includes(k));
      if (foundKey) indicatorData = data.indicators[foundKey];
    }
    return renderCard(indicatorData);
  }).join("");

  const guideRows = GUIDE_LABELS.map(([key,label]) =>
    `<div class="grow"><div class="glabel">${label}</div><div class="gval">${guidance[key] || "—"}</div></div>`
  ).join("");

  document.getElementById("app").innerHTML = `
    <div class="hero">
      <div class="hero-label">Overall Regime</div>
      <div class="regime" style="color:${color}"><span class="dot" style="background:${color}"></span>${regime}</div>
      <div class="narrative">${narrative}</div>
      ${renderGauge(hs.score, regime)}
    </div>

    ${renderHealth(data.data_health || {live_count:0,total_count:0,status:"unknown"})}

    <div class="section-label">Indicators</div>
    <div class="grid">${cards}</div>

    <div class="section-label">Portfolio Read</div>
    <div class="guide">
      <div class="stance-banner">${(guidance.stance || "—")}</div>
      ${guideRows}
    </div>
  `;

  document.getElementById("clock").textContent = "Updated " + fmtAgo(data.generated_at);
}

async function load(){
  try{
    const res = await fetch("data.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data);
  }catch(err){
    document.getElementById("app").innerHTML =
      `<div class="skeleton">Could not load data.json<br><span style="color:var(--hot)">${err}</span></div>`;
  }
}

load();
setInterval(load, 5 * 60 * 1000);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
