<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Market Heat Dashboard</title>
  
  <!-- PWA Manifest & iOS Metas -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.svg">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --card-border: #2c2c2e;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent-blue: #0a84ff;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --accent-orange: #ff9f0a;
      --accent-yellow: #ffd60a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-top: calc(env(safe-area-inset-top) + 16px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status-badge {
      font-size: 0.75rem;
      background: #2c2c2e;
      color: var(--accent-blue);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* HEAT SCORE GAUGE CARD */
    .heat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .heat-score-val {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      margin: 10px 0;
    }

    .regime-badge {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .bg-green { background: rgba(48, 209, 88, 0.2); color: var(--accent-green); }
    .bg-orange { background: rgba(255, 159, 10, 0.2); color: var(--accent-orange); }
    .bg-red { background: rgba(255, 69, 58, 0.2); color: var(--accent-red); }

    /* SECTION HEADINGS */
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    /* ASSET MATRIX GRID */
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .asset-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .asset-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .asset-ticker {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .asset-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .asset-price {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .asset-change {
      font-size: 0.75rem;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: 700;
    }

    .change-up { background: rgba(48, 209, 88, 0.2); color: var(--accent-green); }
    .change-down { background: rgba(255, 69, 58, 0.2); color: var(--accent-red); }

    .sparkline-container {
      margin: 10px 0;
      height: 32px;
    }

    .sparkline-svg {
      width: 100%;
      height: 100%;
      stroke: var(--accent-blue);
      stroke-width: 2;
      fill: none;
    }

    .asset-metrics {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 8px;
    }

    .tailwind-badge {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px;
      border-radius: 6px;
      margin-top: 8px;
      text-align: center;
    }

    .badge-favorable { background: rgba(48, 209, 88, 0.15); color: var(--accent-green); }
    .badge-neutral { background: rgba(142, 142, 147, 0.15); color: var(--text-muted); }

    /* FOOTER METRICS */
    .timestamp {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Market Heat</h1>
    <div id="live-status" class="status-badge">Connecting...</div>
  </header>

  <!-- MACRO HEAT GAUGE CARD -->
  <div class="heat-card">
    <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">MACRO HEAT SCORE</div>
    <div id="heat-score" class="heat-score-val">--</div>
    <div id="regime-name" class="regime-badge bg-orange">Loading Regime...</div>
  </div>

  <!-- PORTFOLIO ASSET MATRIX SECTION -->
  <section>
    <h2 class="section-title">Portfolio Asset Matrix</h2>
    <div id="asset-cards-grid" class="asset-grid">
      <!-- Dynamically populated via Javascript -->
    </div>
  </section>

  <div id="last-updated" class="timestamp">Last Updated: --</div>

  <script>
    async function initDashboard() {
      try {
        // Cache buster parameter prevents browser caching old data
        const res = await fetch('data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error('Data fetch failed');
        
        const data = await res.json();

        // 1. Update Heat Score & Regime Banner
        const score = data.macro.heat_score ?? 50;
        const scoreElem = document.getElementById('heat-score');
        const regimeElem = document.getElementById('regime-name');
        
        scoreElem.innerText = score;
        regimeElem.innerText = data.macro.regime || 'Normal / Soft Landing';

        if (score <= 45) {
          scoreElem.style.color = 'var(--accent-green)';
          regimeElem.className = 'regime-badge bg-green';
        } else if (score <= 65) {
          scoreElem.style.color = 'var(--accent-orange)';
          regimeElem.className = 'regime-badge bg-orange';
        } else {
          scoreElem.style.color = 'var(--accent-red)';
          regimeElem.className = 'regime-badge bg-red';
        }

        // 2. Update Header Status & Footer Timestamp
        document.getElementById('live-status').innerText = data.health?.live_status || 'Live';
        document.getElementById('last-updated').innerText = 'Last Updated: ' + (data.timestamp || 'N/A');

        // 3. Render Portfolio Asset Grid
        const grid = document.getElementById('asset-cards-grid');
        grid.innerHTML = '';

        if (data.assets) {
          for (const [ticker, asset] of Object.entries(data.assets)) {
            const isUp = (asset.d1_pct || 0) >= 0;
            const changeClass = isUp ? 'change-up' : 'change-down';
            const sign = isUp ? '+' : '';
            const tailwindClass = asset.tailwind === 'Favorable' ? 'badge-favorable' : 'badge-neutral';

            const cardHtml = `
              <div class="asset-card">
                <div>
                  <div class="asset-header">
                    <div>
                      <div class="asset-ticker">${ticker}</div>
                      <div class="asset-sub">${asset.name || ''}</div>
                    </div>
                    <span class="asset-change ${changeClass}">${sign}${asset.d1_pct ?? 0}%</span>
                  </div>
                  <div class="asset-price">$${asset.price !== null ? asset.price : 'N/A'}</div>
                </div>

                <div class="sparkline-container">
                  <svg class="sparkline-svg" viewBox="0 0 120 30" preserveAspectRatio="none">
                    <path d="${asset.sparkline_svg || ''}" />
                  </svg>
                </div>

                <div>
                  <div class="asset-metrics">
                    <span>1M: ${asset.m1_pct ?? 0}%</span>
                    <span>3M: ${asset.m3_pct ?? 0}%</span>
                  </div>
                  <div class="tailwind-badge ${tailwindClass}">
                    ${asset.tailwind || 'Neutral'} Tailwinds
                  </div>
                </div>
              </div>
            `;
            grid.innerHTML += cardHtml;
          }
        }
      } catch (err) {
        console.error('Failed to load dashboard data:', err);
        document.getElementById('live-status').innerText = 'Offline / Error';
      }
    }

    // Run on page load
    initDashboard();

    // Register Service Worker for PWA Offline Capability
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
